<div class="info alert margin-y">
  <mat-icon class="icon">info</mat-icon>
  <span>{{ "inscripcion.alerta_experiencia_laboral" | translate }}</span>
</div>

@if (!nuevoTercero) {
  <ngx-dinamicform
    [normalform]="formInfoExperienciaLaboral"
    [modeloData]="info_experiencia_laboral"
    (result)="validarForm($event)"
    (resultAux)="searchNit($event); updateFinishDate($event)"
    (dateChange)="onChangeDate()"
    [clean]="clean"
    (interlaced)="getSeleccion($event)"
    (percentage)="setPercentage($event)"
    >
  </ngx-dinamicform>
}

<div class="row">
  @if (nuevoTercero) {
    <ngx-new-tercero (result)="NuevoTercero($event)" [nit]="nit">
    </ngx-new-tercero>
  }

  @if (nuevoTercero) {
    <button
      mat-flat-button
      color="warn"
      (click)="nuevoTercero = false"
      class="margin-y"
      >
      {{ "GLOBAL.cancelar" | translate }}
    </button>
  }
</div>
