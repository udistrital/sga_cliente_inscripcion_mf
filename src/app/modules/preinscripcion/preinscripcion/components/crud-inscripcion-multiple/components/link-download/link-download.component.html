<!--Botón de descarga cuando el recibo se encuentra activo-->
@if (download) {
  <button (click)="showDownload()" class="boton-search">
    &nbsp;<mat-icon class="icon-search">search-outline</mat-icon>
    {{ "inscripcion.visualizar_recibo" | translate }}
  </button>
}

<!--Botón de bloqueo cuando el recibo se encuentra inactivo-->
@if (expired) {
  <label class="recibo-vencido">
    &nbsp;<mat-icon class="close-icon">close</mat-icon
    >{{ "inscripcion.Recibo_vencido" | translate }}
  </label>
}
